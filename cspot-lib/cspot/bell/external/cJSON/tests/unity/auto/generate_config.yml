    :src: |
      //-------------------------------------------
      // %1$s.c
      //-------------------------------------------
    :inc: |
      //-------------------------------------------
      // %1$s.h
      //-------------------------------------------
    :tst: |
      //-------------------------------------------
      // Test%1$s.c : Units tests for %1$s.c
      //-------------------------------------------
