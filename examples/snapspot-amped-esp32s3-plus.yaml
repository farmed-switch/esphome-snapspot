substitutions:
  name: snapspot-amped-esp32s3-plus
  friendly_name: Snapspot Amped ESP32-S3 PLUS

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  min_version: 2026.4.0
  platformio_options:
    board_build.flash_mode: dio

esp32:
  board: esp32-s3-devkitc-1
  variant: ESP32S3
  flash_size: 8MB
  cpu_frequency: 240MHz
  framework:
    type: esp-idf
    version: recommended
    advanced:
      enable_full_printf: true

logger:
  level: INFO

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none
  fast_connect: true

ota:
  - platform: esphome
    password: !secret ota_password

api:

safe_mode:
  disabled: false

mdns:

network:
  enable_ipv6: true

external_components:
  - source: github://farmed-switch/esphome-snapspot@main
    components: [snapspot, snapclient, spotify_connect]
    refresh: 1d
  - source: github://sonocotta/esphome-pcm5122
    components: [pcm5122]
    refresh: 1d

psram:
  mode: octal
  speed: 80MHz
  ignore_not_found: false

i2c:
  sda: GPIO18
  scl: GPIO8
  frequency: 400kHz

audio_dac:
  - platform: pcm5122
    id: external_dac
    address: 0x4D
    enable_pin: GPIO4

i2s_audio:
  - id: i2s_audio_bus
    i2s_lrclk_pin: GPIO15
    i2s_bclk_pin: GPIO14

speaker:
  - platform: i2s_audio
    id: i2s_output
    i2s_audio_id: i2s_audio_bus
    dac_type: external
    i2s_dout_pin: GPIO16
    channel: stereo

  - platform: mixer
    id: audio_mixer
    output_speaker: i2s_output
    task_stack_in_psram: true
    queue_mode: true
    source_speakers:
      - id: cspot_source
        buffer_duration: 500ms
      - id: snapclient_source

snapspot:
  audio_dac: external_dac
  mixer_id: audio_mixer
  software_eq: true

switch:
  - platform: gpio
    icon: "mdi:speaker"
    name: Enable AMP
    id: enable_amp
    pin:
      number: GPIO17
    restore_mode: ALWAYS_ON

button:
  - platform: restart
    name: "Restart"

text_sensor:
  - platform: wifi_info
    ip_address:
      name: "IP"
    bssid:
      name: "BSSID"
    ssid:
      name: "SSID"

sensor:
  - platform: wifi_signal
    name: "WiFi Signal"
    update_interval: 60s
  - platform: uptime
    name: "Uptime"
  - platform: internal_temperature
    name: "CPU Temp"

media_player:
  - platform: snapclient
    name: "Snapcast"
    hostname: snapserver.local
    snapcast_min_db: -60.0
    snapcast_max_db: 0.0
    min_volume: 0
    max_volume: 100
    track_name:
      name: "Snapcast Track"
    artist:
      name: "Snapcast Artist"
    album:
      name: "Snapcast Album"
    album_art_url:
      name: "Snapcast Art URL"
    duration:
      name: "Snapcast Duration"
    position:
      name: "Snapcast Position"

  - platform: spotify_connect
    name: "Spotify"
    spotify_min_db: -60.0
    spotify_max_db: 0.0
    min_volume: 0
    max_volume: 100
    track_name:
      name: "Spotify Track"
    artist:
      name: "Spotify Artist"
    album:
      name: "Spotify Album"
    album_art_url:
      name: "Spotify Art URL"
    duration:
      name: "Spotify Duration"
    position:
      name: "Spotify Position"
