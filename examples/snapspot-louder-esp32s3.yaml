substitutions:
  name: snapspot-louder-esp32s3
  friendly_name: Snapspot Louder ESP32-S3

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  min_version: 2026.4.0
  platformio_options:
    board_build.flash_mode: dio

esp32:
  board: esp32-s3-devkitc-1
  variant: ESP32S3
  flash_size: 8MB
  cpu_frequency: 240MHz
  framework:
    type: esp-idf
    version: recommended
    advanced:
      enable_full_printf: true

logger:
  level: INFO

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none
  fast_connect: true

ota:
  - platform: esphome
    password: !secret ota_password

api:

safe_mode:
  disabled: false

mdns:

network:
  enable_ipv6: true

external_components:
  - source: github://farmed-switch/esphome-snapspot@main
    components: [snapspot, snapclient, spotify_connect]
    refresh: 1d
  - source: github://mrtoy-me/esphome-tas58xx@main
    components: [tas58xx]
    refresh: 1d

psram:
  mode: octal
  speed: 80MHz
  ignore_not_found: false

i2c:
  sda: GPIO8
  scl: GPIO9
  frequency: 400kHz
  scan: true

i2s_audio:
  - id: i2s_audio_bus
    i2s_lrclk_pin: GPIO15
    i2s_bclk_pin: GPIO14

audio_dac:
  - platform: tas58xx
    id: tas58xx_dac
    tas58xx_dac: TAS5805M
    enable_pin: GPIO17
    dac_mode: BTL
    mixer_mode: STEREO
    refresh_eq: MANUAL
    analog_gain: 0dB
    volume_max: 0dB
    volume_min: -45dB
    update_interval: 1s

speaker:
  - platform: i2s_audio
    id: i2s_output
    i2s_audio_id: i2s_audio_bus
    dac_type: external
    i2s_dout_pin: GPIO16
    channel: stereo

  - platform: mixer
    id: audio_mixer
    output_speaker: i2s_output
    task_stack_in_psram: true
    queue_mode: true
    source_speakers:
      - id: cspot_source
        buffer_duration: 500ms
      - id: snapclient_source

snapspot:
  audio_dac: tas58xx_dac
  mixer_id: audio_mixer
  software_eq: false

switch:
  - platform: tas58xx
    enable_dac:
      name: "DAC"
      id: enable_dac
      restore_mode: ALWAYS_ON

button:
  - platform: restart
    name: "Restart"

select:
  - platform: tas58xx
    eq_mode:
      name: "DSP"

number:
  - platform: tas58xx
    left_eq_gain_20Hz:
      name: "EQ ---20Hz"
    left_eq_gain_31.5Hz:
      name: "EQ ---31Hz"
    left_eq_gain_50Hz:
      name: "EQ ---50Hz"
    left_eq_gain_80Hz:
      name: "EQ ---80Hz"
    left_eq_gain_125Hz:
      name: "EQ --125Hz"
    left_eq_gain_200Hz:
      name: "EQ --200Hz"
    left_eq_gain_315Hz:
      name: "EQ --315Hz"
    left_eq_gain_500Hz:
      name: "EQ --500Hz"
    left_eq_gain_800Hz:
      name: "EQ --800Hz"
    left_eq_gain_1250Hz:
      name: "EQ -1.25kHz"
    left_eq_gain_2000Hz:
      name: "EQ -2kHz"
    left_eq_gain_3150Hz:
      name: "EQ -3.15kHz"
    left_eq_gain_5000Hz:
      name: "EQ -5kHz"
    left_eq_gain_8000Hz:
      name: "EQ -8kHz"
    left_eq_gain_16000Hz:
      name: "EQ 16kHz"

text_sensor:
  - platform: wifi_info
    ip_address:
      name: "IP"
    bssid:
      name: "BSSID"
    ssid:
      name: "SSID"

sensor:
  - platform: wifi_signal
    name: "WiFi Signal"
    update_interval: 60s
  - platform: uptime
    name: "Uptime"
  - platform: internal_temperature
    name: "CPU Temp"

media_player:
  - platform: snapclient
    name: "Snapcast"
    hostname: snapserver.local
    snapcast_min_db: -60.0
    snapcast_max_db: 0.0
    min_volume: 0
    max_volume: 100
    track_name:
      name: "Snapcast Track"
    artist:
      name: "Snapcast Artist"
    album:
      name: "Snapcast Album"
    album_art_url:
      name: "Snapcast Art URL"
    duration:
      name: "Snapcast Duration"
    position:
      name: "Snapcast Position"

  - platform: spotify_connect
    name: "Spotify"
    spotify_min_db: -60.0
    spotify_max_db: 0.0
    min_volume: 0
    max_volume: 100
    track_name:
      name: "Spotify Track"
    artist:
      name: "Spotify Artist"
    album:
      name: "Spotify Album"
    album_art_url:
      name: "Spotify Art URL"
    duration:
      name: "Spotify Duration"
    position:
      name: "Spotify Position"
